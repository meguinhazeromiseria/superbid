name: Superbid Scrapers

on:
  schedule:
    - cron: '0 8 * * *'   # todo dia às 05:00 BRT (08:00 UTC)
  workflow_dispatch:        # disparo manual pelo GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Rodar scraper embarcacoes
        run: python scrapers/superbid/superbid_embarcacoes.py --output /tmp/superbid_embarcacoes.json

      - name: Rodar scraper quantidade
        run: python scrapers/superbid/superbid_quantidade.py --output /tmp/superbid_quantidade.json

      - name: Rodar scraper colecionismo
        run: python scrapers/superbid/superbid_colecionismo.py --output /tmp/superbid_colecionismo.json

      - name: Upload artefatos (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superbid-${{ github.run_id }}
          path: |
            /tmp/superbid_embarcacoes.json
            /tmp/superbid_quantidade.json
            /tmp/superbid_colecionismo.json
          retention-days: 7